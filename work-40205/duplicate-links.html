<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duplicate links test</title>
</head>
<body>
<h1>Duplicate links test</h1>

<p>First link is <b>hidden</b>, second is <b>visible</b></p>
<ul>
    <li><a href="/index" style="visibility: hidden">Index link (hidden)</a></li>
    <li><a href="/index">Index link (visible)</a></li>
</ul>

<p>First link is <b>visible</b>, second is <b>hidden</b></p>
<ul>
    <li><a href="/test">Test link (visible)</a></li>
    <li><a href="/test" style="visibility: hidden">Test link (hidden)</a></li>
</ul>
</body>
</html>
